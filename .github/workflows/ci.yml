name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  python:
    name: Python (lock, ruff, mypy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Lock file matches pyproject.toml
        run: uv lock --check

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Mypy
        run: uv run --frozen mypy

      - name: OpenAPI schema matches frontend/openapi.json
        run: uv run --frozen arxplore openapi | diff -u frontend/openapi.json -

      - name: Unit tests
        run: uv run --frozen pytest tests/unit

      - name: Fake server and golden harness without the golden database
        run: uv run --frozen pytest tests/fakes tests/golden

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arxplore
          POSTGRES_PASSWORD: arxplore
          POSTGRES_DB: v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arxplore -d v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V2_TEST_DATABASE_URL: postgresql://arxplore:arxplore@localhost:5432/v2_test
      V2_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Migrate a fresh database with the CLI
        env:
          POSTGRES_HOST: localhost:5432
          APP_POSTGRES_DB: v2_test
          POSTGRES_USER: arxplore
          POSTGRES_PASSWORD: arxplore
        run: |
          uv run --frozen arxplore migrate --dry-run
          uv run --frozen arxplore migrate
          uv run --frozen arxplore migrate
          uv run --frozen arxplore db-status | tee db-status.txt
          grep -q "^ready: yes$" db-status.txt

      - name: Integration tests
        run: uv run --frozen pytest tests/integration

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Infra (compose config, hadolint, shellcheck, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a dummy .env
        run: |
          cat > .env <<'DOTENV'
          PROD_POSTGRES_HOST=postgres-local:5432
          POSTGRES_HOST=localhost
          SERVER_POSTGRES_PORT=15432
          POSTGRES_DB=arxplore
          APP_POSTGRES_DB=arxplore_app
          POSTGRES_USER=arxplore
          POSTGRES_PASSWORD=arxplore
          OPENAI_API_KEY=sk-ci-dummy
          TAILSCALE_SERVER_IP=127.0.0.1
          DOTENV

      - name: compose.yaml
        run: docker compose -f compose.yaml --profile dev --profile parser --profile local-db config -q

      - name: compose.server.yaml
        run: docker compose -f compose.server.yaml config -q

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          failure-threshold: warning

      - name: Shellcheck
        run: shellcheck scripts/*.sh docker/postgres/init/*.sh

      - name: nginx configuration
        run: docker run --rm -v "$PWD/docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose --exit-code 1 .

  worklog:
    name: Worklog index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: worklog check
        run: python3 scripts/worklog.py check
