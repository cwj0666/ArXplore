name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  python:
    name: Python (lock, ruff, mypy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Lock file matches pyproject.toml
        run: uv lock --check

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Mypy
        run: uv run --frozen mypy

      - name: Unit tests
        run: uv run --frozen pytest tests/unit

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arxplore
          POSTGRES_PASSWORD: arxplore
          POSTGRES_DB: v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arxplore -d v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V2_TEST_DATABASE_URL: postgresql://arxplore:arxplore@localhost:5432/v2_test
      V2_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Migrate a fresh database with the CLI
        env:
          POSTGRES_HOST: localhost:5432
          APP_POSTGRES_DB: v2_test
          POSTGRES_USER: arxplore
          POSTGRES_PASSWORD: arxplore
        run: |
          uv run --frozen arxplore migrate --dry-run
          uv run --frozen arxplore migrate
          uv run --frozen arxplore migrate
          uv run --frozen arxplore db-status | tee db-status.txt
          grep -q "^ready: yes$" db-status.txt

      - name: Integration tests
        run: uv run --frozen pytest tests/integration
