upstream arxplore_django {
    server django:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /srv/django-static/;
        access_log off;
        expires 1h;
    }

    location = /bootstrap.json {
        proxy_pass http://arxplore_django;
    }

    location ~ ^/papers/(assistant|[^/]+/chat)/stream/$ {
        proxy_pass http://arxplore_django;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location = /papers/list.json {
        proxy_pass http://arxplore_django;
    }

    location ~ ^/papers/[^/]+/(detail\.json|analyze/|summary/|chat/)$ {
        proxy_pass http://arxplore_django;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
