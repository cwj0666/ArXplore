[project]
name = "arxplore"
version = "2.0.0.dev0"
description = "RAG platform over Hugging Face Daily Papers and arXiv"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2",
    "fastapi>=0.141",
    "httpx>=0.28",
    "langchain>=1.3",
    "langchain-openai>=1.6",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "openai>=3.3",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pypdf>=6.19",
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
    "redis>=6",
]

[project.scripts]
arxplore = "arxplore.cli:app"
arxplore-eval = "arxplore_eval.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "numpy>=2.5",
    "pillow>=12.3",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "respx>=0.22",
    "ruff>=0.16",
]
eval = [
    "ragas==0.4.3",
    "tiktoken>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxplore", "src/arxplore_eval"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arxplore", "arxplore_eval"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL with pgvector at V2_TEST_DATABASE_URL",
    "golden: compares the implementation with the captured golden data under tests/golden",
]
