x-airflow-common: &airflow-common
  image: arxplore-airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "False"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:?Set AIRFLOW_ADMIN_USER in .env}:admin
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@arxplore-postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://arxplore-airflow-web:8080/execution/
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:?Set AIRFLOW_API_AUTH_JWT_SECRET in .env}
    PYTHONPATH: /opt/airflow:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - arxplore_airflow_logs:/opt/airflow/logs

services:
  arxplore-postgres:
    container_name: arxplore-postgres
    image: arxplore-postgres
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB}
    volumes:
      - arxplore_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${TAILSCALE_SERVER_IP:?Set TAILSCALE_SERVER_IP}:${SERVER_POSTGRES_PORT:-15432}:5432"
    restart: unless-stopped

  arxplore-airflow-init:
    <<: *airflow-common
    container_name: arxplore-airflow-init
    command: bash -lc "airflow db migrate"
    depends_on:
      arxplore-postgres:
        condition: service_healthy

  arxplore-airflow-web:
    <<: *airflow-common
    container_name: arxplore-airflow-web
    command: airflow api-server
    depends_on:
      arxplore-airflow-init:
        condition: service_completed_successfully
    ports:
      - "${TAILSCALE_SERVER_IP:?Set TAILSCALE_SERVER_IP}:${SERVER_AIRFLOW_PORT:-18080}:8080"
    restart: unless-stopped

  arxplore-airflow-scheduler:
    <<: *airflow-common
    container_name: arxplore-airflow-scheduler
    command: airflow scheduler
    depends_on:
      arxplore-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  arxplore-airflow-dag-processor:
    <<: *airflow-common
    container_name: arxplore-airflow-dag-processor
    command: airflow dag-processor
    depends_on:
      arxplore-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  arxplore_postgres_data:
    external: true
    name: arxplore_server_arxplore_postgres_data
  arxplore_airflow_logs:
    external: true
    name: arxplore_server_arxplore_airflow_logs
